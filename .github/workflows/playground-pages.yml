name: Deploy Playground

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: github-pages
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
              with:
                  version: 12.10.1
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm --filter @antash00/form-builder-mui build
            - name: Build Playground for GitHub Pages
              run: pnpm --filter playground build
              env:
                  GITHUB_PAGES: 'true'
            - name: Support direct links to examples
              run: cp apps/playground/dist/index.html apps/playground/dist/404.html
            - uses: actions/configure-pages@v5
            - uses: actions/upload-pages-artifact@v4
              with:
                  path: apps/playground/dist

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        permissions:
            pages: write
            id-token: write
        steps:
            - id: deployment
              uses: actions/deploy-pages@v4
